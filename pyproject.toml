[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "orphantest"
version = "1.0.0"
description = "Deterministic execution-inventory discrepancy reports for declared test commands"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "orphantest contributors"}]
keywords = ["testing", "ci", "inventory", "deterministic", "sarif"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
]
dependencies = []

[project.scripts]
orphantest = "orphantest.cli:main"

[project.urls]
Homepage = "https://github.com/orphantest/orphantest"
Issues = "https://github.com/orphantest/orphantest/issues"
Security = "https://github.com/orphantest/orphantest/blob/main/SECURITY.md"

[tool.setuptools]
packages = ["orphantest"]
